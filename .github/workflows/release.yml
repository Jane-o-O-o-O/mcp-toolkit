name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Publish packages
        run: |
          for pkg in packages/*/; do
            echo "Publishing $pkg..."
            cd "$pkg"
            pnpm publish --no-git-checks --access public || echo "Skipping $pkg (already published or error)"
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: \${{ secrets.NPM_TOKEN }}
